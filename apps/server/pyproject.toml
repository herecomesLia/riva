[project]
name = "riva-server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "argon2-cffi>=25.1.0",
  "asgi-correlation-id>=5.0.1",
  "async-lru>=2.3.0",
  "psycopg[binary,pool]>=3.2.0",
  "fastapi[standard]>=0.138.1",
  "pydantic>=2.13.4",
  "typed-settings[cattrs,dotenv]>=25.3.0",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.45",
  "structlog>=26.1.0",
  "typing-extensions>=4.16.0",
  "typer>=0.20.0",
  "langchain-core>=1.6.1",
  "langchain-openai>=1.6.0",
  "openai>=3.7.0",
  "procrastinate>=3.9.0,<3.10",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1.0",
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.11.0",
  "testcontainers[postgres]>=4.15.0",
  "watchfiles>=1.1.1",
]

[project.scripts]
riva = "riva.cli:main"

[tool.uv.build-backend]
module-name = "riva"

[tool.coverage.run]
branch = true
source = ["riva"]

[tool.coverage.report]
skip_empty = true
skip_covered = true

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
